services:
  fraud-api:
    build: .
    image: fraud-service:dev
    ports: ["8000:8000"]
    environment:
      FRAUD_MODEL_PATH: models/fraud_model.joblib
    depends_on:
      feature-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS",
             "http://localhost:8000/v1/ready"]
      interval: 10s
      start_period: 20s
  feature-cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
